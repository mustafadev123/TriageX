<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Helvetica, Arial, sans-serif">
  <!-- VALID card -->
  <g transform="translate(10,10)">
    <rect width="470" height="300" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <rect width="470" height="62" rx="18" fill="#0f766e"/>
    <rect y="40" width="470" height="22" fill="#0f766e"/>
    <text x="22" y="42" font-size="30" font-weight="800" fill="#ffffff">TriageX DEMO</text>
    <text x="300" y="40" font-size="16" font-weight="700" fill="#ccfbf1">STAFF CARD</text>
    <text x="22" y="92" font-size="15" font-weight="700" fill="#b91c1c">FICTIONAL · NOT A REAL CREDENTIAL</text>
    <text x="22" y="140" font-size="22" fill="#475569">ID</text>
    <text x="72" y="140" font-size="40" font-weight="800" fill="#0f172a">TX-RN-1001</text>
    <text x="22" y="182" font-size="30" font-weight="700" fill="#0f172a">Avery (fictional RN)</text>
    <text x="22" y="218" font-size="22" fill="#334155">Registered Nurse · Emergency</text>
    <text x="22" y="256" font-size="26" font-weight="800" fill="#047857">AVAILABLE</text>
    <text x="22" y="284" font-size="18" fill="#334155">Surge shift 16:30–20:30 (simulated)</text>
  </g>
  <!-- INVALID card -->
  <g transform="translate(510,10)">
    <rect width="470" height="300" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="4"/>
    <rect width="470" height="62" rx="18" fill="#0f766e"/>
    <rect y="40" width="470" height="22" fill="#0f766e"/>
    <text x="22" y="42" font-size="30" font-weight="800" fill="#ffffff">TriageX DEMO</text>
    <text x="300" y="40" font-size="16" font-weight="700" fill="#ccfbf1">STAFF CARD</text>
    <text x="22" y="92" font-size="15" font-weight="700" fill="#b91c1c">FICTIONAL · NOT A REAL CREDENTIAL</text>
    <text x="22" y="140" font-size="22" fill="#475569">ID</text>
    <text x="72" y="140" font-size="40" font-weight="800" fill="#0f172a">TX-RN-9999</text>
    <text x="22" y="182" font-size="30" font-weight="700" fill="#0f172a">Sam (fictional RN)</text>
    <text x="22" y="218" font-size="22" fill="#334155">Registered Nurse · Emergency</text>
    <text x="22" y="256" font-size="26" font-weight="800" fill="#b45309">OFF DUTY</text>
    <text x="22" y="284" font-size="18" fill="#334155">Not on the synthetic roster (rejection test)</text>
  </g>
  <text x="10" y="334" font-size="14" fill="#475569">Left: valid test card (must be accepted). Right: invalid test card (must be rejected). Print at ~9 × 6 cm or larger, matte paper.</text>
</svg>
