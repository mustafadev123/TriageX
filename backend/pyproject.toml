[project]
name = "triagex-backend"
version = "0.1.0"
description = "TriageX backend: deterministic ED surge simulation and coordination API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.7",
    "httpx>=0.28.1",
    "pg8000>=1.31.6",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
